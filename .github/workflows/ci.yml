name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check pharma_name_gen tests --output-format=github
        continue-on-error: true
      - name: Test
        # PHARMA_NAME_GEN_OFFLINE forces the committed snapshot. CI must never depend on
        # openFDA or EMA being reachable: a red build should mean our code broke,
        # not that a regulator's API had a bad afternoon.
        env:
          PHARMA_NAME_GEN_OFFLINE: "1"
        run: pytest --cov=pharma_name_gen --cov-report=term-missing
