[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma_name_gen"
version = "2.1.0"
description = "Regulation-aware pharmaceutical name generation and screening"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0,<3.0", "pydantic>=2.5,<3.0", "requests>=2.31,<3.0"]

[project.optional-dependencies]
app = ["streamlit>=1.30,<2.0", "ipywidgets>=8.0,<9.0", "matplotlib>=3.7,<4.0"]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["pharma_name_gen*"]

[tool.setuptools.package-data]
pharma_name_gen = ["../data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
